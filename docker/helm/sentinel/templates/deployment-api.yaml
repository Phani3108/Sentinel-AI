apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-api
  labels:
    app: sentinel
    component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: sentinel
      component: api
  template:
    metadata:
      labels:
        app: sentinel
        component: api
    spec:
      containers:
        - name: sentinel-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_URL
              value: "redis://sentinel-redis:6379/0"
            - name: SENTINEL_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinel-secrets
                  key: admin-key
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: ollama-socket
              mountPath: /var/run/ollama
      volumes:
        - name: ollama-socket
          hostPath:
            path: /var/run/ollama
