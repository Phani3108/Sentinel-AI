apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinel-redis
  labels:
    app: sentinel
    component: redis
spec:
  serviceName: "sentinel-redis"
  replicas: 1
  selector:
    matchLabels:
      app: sentinel
      component: redis
  template:
    metadata:
      labels:
        app: sentinel
        component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          ports:
            - containerPort: 6379
              name: redis
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-redis
spec:
  ports:
    - port: 6379
  selector:
    app: sentinel
    component: redis
